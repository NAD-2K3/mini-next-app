name: CI / CD for mini-next-app
# Add Comment to test PRs
on:
  # push:
  #   branches: [ "main" ]   
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: arc-runners
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Nx status
        run: npx nx report

      - name: Run Tests
        run: npx nx lint next-app
        continue-on-error: true

      - name: Code Quality Analysis with SonarCloud  
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        with:
          args: >
            -Dsonar.projectKey=mini-next-app
            -Dsonar.sources=.
        env:
          SONAR_TOKEN: sqp_a722b085b85d38ff5a3f200b7d1fa376cb544723
          SONAR_HOST_URL: http://sonarqube-sonarqube.platform-core.svc.cluster.local:9000
      
  #     - name: Dependencies Analysis with Snyk
  #       uses: snyk/actions/node@master
  #       env:
  #         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  #       with:
  #         command: monitor

  #     - name: IaC Analysis with Snyk
  #       uses: snyk/actions/iac@master
  #       env:
  #         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  #       with:
  #         command: monitor
  #         file: ./cdk

  scan_and_push_image:
    runs-on: ubuntu-latest
    # if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          docker build \
          -f ./Dockerfile \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/mini-next-app:$IMAGE_TAG \
          --build-arg NEXT_PUBLIC_AWS_REGION=${{ secrets.NEXT_PUBLIC_AWS_REGION }} \
          --build-arg NEXT_PUBLIC_AWS_ACCOUNT=${{ secrets.NEXT_PUBLIC_AWS_ACCOUNT }} \
          --build-arg NEXT_PUBLIC_S3_BUCKET=${{ secrets.NEXT_PUBLIC_S3_BUCKET }} \
          --build-arg NEXT_PUBLIC_USER_POOL_ID=${{ secrets.NEXT_PUBLIC_USER_POOL_ID }} \
          --build-arg NEXT_PUBLIC_USER_POOL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_USER_POOL_CLIENT_ID }} \
          --build-arg NEXT_PUBLIC_USER_POOL_IDENTITY_ID=${{ secrets.NEXT_PUBLIC_USER_POOL_IDENTITY_ID }} \
          .

      # - name: Scan Docker image with Snyk
      #   uses: snyk/actions/docker@master
      #   env:
      #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      #   with:
      #     image: ${{ secrets.DOCKERHUB_USERNAME }}/mini-next-app:staging
      #     command: monitor
      #   continue-on-error: true

      - name: Push Docker image to Docker Hub
        run: |
          IMAGE_TAG=${GITHUB_SHA::8}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/mini-next-app:$IMAGE_TAG